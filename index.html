<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเฝ้าระวังและสารสนเทศระบาดวิทยาการเสียชีวิตจากอุบัติเหตุทางถนน</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        panelbg: '#111827',
                        cardbg: '#1f2937',
                        bordercolor: '#374151',
                        accentred: '#ef4444',
                        accentamber: '#f59e0b',
                        accentcyan: '#06b6d4',
                        accentemerald: '#10b981',
                        accentpurple: '#8b5cf6'
                    },
                    fontFamily: {
                        sans: ['Inter', 'Sarabun', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Leaflet Marker Cluster -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
    
    <!-- Leaflet Heatmap -->
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    
    <!-- PapaParse for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Custom Scrollbar & Map Overlay CSS -->
    <style>
        body {
            background-color: #090d16;
            color: #e5e7eb;
            font-family: 'Sarabun', 'Inter', sans-serif;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #1f2937 !important;
            color: #f3f4f6 !important;
            border: 1px solid #374151;
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }
        .pulse-live {
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse-green 2s infinite;
        }
        @keyframes pulse-green {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(55, 65, 81, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-accentred selection:text-white">

    <!-- Top Header Bar -->
    <header class="sticky top-0 z-50 glass-panel border-b border-gray-800 px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-3">
            <!-- Title & Badge -->
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-red-950/60 border border-red-500/30 rounded-xl text-red-500 flex items-center justify-center">
                    <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg md:text-xl font-bold text-white tracking-wide">
                            ระบบเฝ้าระวังและสารสนเทศระบาดวิทยาการเสียชีวิตจากอุบัติเหตุทางถนน
                        </h1>
                        <span class="bg-red-500/10 text-red-400 border border-red-500/20 text-xs px-2 py-0.5 rounded-full font-semibold hidden sm:inline-block">
                            Epi-Surveillance
                        </span>
                    </div>
                    <p class="text-xs text-gray-400 flex items-center gap-2">
                        <span><i class="fa-solid fa-database text-accentcyan mr-1"></i> Google Sheets Live Pipeline</span>
                        <span>•</span>
                        <span>ESRI World Dark Canvas GIS</span>
                    </p>
                </div>
            </div>

            <!-- Live Controls & Actions -->
            <div class="flex items-center flex-wrap gap-2.5">
                <!-- Sync Status Indicator -->
                <div class="flex items-center space-x-2 bg-gray-800/80 border border-gray-700/80 px-3 py-1.5 rounded-lg text-xs">
                    <span id="livePulse" class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-live"></span>
                    <span id="syncText" class="text-gray-300 font-medium">เชื่อมต่อแล้ว</span>
                    <span class="text-gray-500">|</span>
                    <span id="lastUpdated" class="text-gray-400">อัปเดตล่าสุด: -</span>
                </div>

                <!-- Add Pin Button -->
                <button onclick="openPinModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow-md transition-all flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-location-dot text-amber-300"></i>
                    <span>ปักหมุดจุดเกิดเหตุใหม่</span>
                </button>

                <!-- Auto Refresh Selector -->
                <div class="flex items-center space-x-1 bg-gray-800/80 border border-gray-700/80 px-2 py-1.5 rounded-lg text-xs text-gray-300">
                    <i class="fa-solid fa-clock text-gray-400 ml-1"></i>
                    <select id="refreshInterval" class="bg-transparent text-gray-200 text-xs focus:outline-none cursor-pointer pr-1">
                        <option value="0" class="bg-gray-900">ปิด Auto-Refresh</option>
                        <option value="10" class="bg-gray-900">อัปเดตทุก 10 วิ</option>
                        <option value="30" class="bg-gray-900" selected>อัปเดตทุก 30 วิ</option>
                        <option value="60" class="bg-gray-900">อัปเดตทุก 1 นาที</option>
                    </select>
                </div>

                <!-- Refresh Button -->
                <button id="btnFetch" onclick="fetchLiveData()" class="bg-accentcyan/20 hover:bg-accentcyan/30 text-accentcyan border border-accentcyan/40 px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 active:scale-95">
                    <i class="fa-solid fa-rotate text-xs" id="refreshIcon"></i>
                    <span>ดึงข้อมูลสด</span>
                </button>

                <!-- Data Source / Config Modal Toggle -->
                <button onclick="openConfigModal()" class="bg-blue-600 hover:bg-blue-500 text-white shadow-lg border border-blue-400 px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-file-excel"></i>
                    <span class="hidden sm:inline">เชื่อมต่อ Google Sheets</span>
                </button>

                <!-- GitHub Guide Modal Toggle -->
                <button onclick="openGithubModal()" class="bg-purple-900/30 hover:bg-purple-900/50 text-purple-300 border border-purple-500/40 px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5">
                    <i class="fa-brands fa-github"></i>
                    <span>GitHub Pages Guide</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-4 space-y-4 flex-1 w-full">

        <!-- Dynamic Filter Controls -->
        <section class="glass-panel p-4 rounded-xl shadow-lg border border-gray-800">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-sm font-semibold text-gray-200 flex items-center gap-2">
                    <i class="fa-solid fa-filter text-accentcyan"></i>
                    <span>ตัวกรองข้อมูลทางระบาดวิทยา (Interactive Epidemiological Filters)</span>
                </h2>
                <button onclick="resetFilters()" class="text-xs text-gray-400 hover:text-red-400 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-arrow-rotate-left"></i> รีเซ็ตตัวกรองทั้งหมด
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 text-xs">
                <!-- Search Box -->
                <div>
                    <label class="block text-gray-400 mb-1 font-medium">ค้นหา (คำค้น/อำเภอ/สถานที่)</label>
                    <div class="relative">
                        <i class="fa
